    <script>
      // In development preview within iframes, ignore Vite internal HMR connection failures without suppressing application errors
      window.addEventListener('error', function (event) {
        if (event.filename && event.filename.includes('@vite/client')) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var details = '' + (event.reason && (event.reason.stack || event.reason.message || event.reason) || '');
        if (details.includes('@vite/client')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
